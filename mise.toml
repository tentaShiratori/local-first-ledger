# Exact tool pins for this repository (no latest / floating ranges).
# npm backend: https://mise.jdx.dev/dev-tools/backends/npm.html
# Python: https://mise.jdx.dev/lang/python.html
# Verified with mise 2026.11.4 on linux-x64.
#
# These pins match package.json:
# - engines.node includes 22.23.4
# - packageManager = pnpm@10.33.4
# - npm package "skills" (vercel-labs/skills) = 1.7.6
# Python 3.13.18 is for yomiyasu checks (stdlib only; no pip packages required).

[tools]
node = "22.23.4"
pnpm = "10.33.4"
"npm:skills" = "1.7.6"
python = "3.13.18"

[env]
_.python.venv = { path = ".venv", create = true }
